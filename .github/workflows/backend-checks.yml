name: Backend Status Checks

on:
  workflow_call:
    inputs:
      cached-build-id:
        description: "ID for cached build"
        required: true
        type: string

jobs:
  backend-checks:
    name: Backend Status Checks
    runs-on: ubuntu-latest

    steps:
      - name: Restore Build
        uses: actions/cache/restore@v5
        id: restore-build
        with:
          path: ./*
          key: ${{ inputs.cached-build-id }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Run linting/format - backend
        run: pnpm --filter "./backend/*" run check

      - name: Run type checking - backend
        run: pnpm --filter "./backend/*" run tsc

      - name: Run tests with coverage - backend
        run: pnpm --filter "./backend/*" run test:coverage
