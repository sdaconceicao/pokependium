name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "backend/auth/src/migrations/**"
      - "backend/auth/src/run-migrations.ts"
      - "backend/pokedex-rest/src/migrations/**"
      - "backend/pokedex-rest/src/run-migrations.ts"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Never run two migration jobs at once; queue instead of cancelling so
# every pushed migration still gets applied, in order.
concurrency:
  group: postgres-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run auth migrations
        run: pnpm --filter ./backend/auth run migration:run
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Run REST migrations
        run: pnpm --filter ./backend/pokedex-rest run migration:run
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
